<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Добавить книгу</title>
</head>
<body>

<h1>Добавить новую книгу</h1>

<form th:action="@{/books/add}" th:object="${bookForm}" method="post">

    <!-- Поле для названия книги -->
    <div>
        <label for="title">Название книги:</label>
        <input type="text" id="title" th:field="*{title}" />
        <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Ошибка</div>
    </div>

    <!-- Поле для автора -->
    <div>
        <label for="authorName">Автор:</label>
        <input type="text" id="authorName" th:field="*{authorName}" />
        <div th:if="${#fields.hasErrors('authorName')}" th:errors="*{authorName}">Ошибка</div>
    </div>

    <!-- Кнопка отправки -->
    <div>
        <button type="submit">Добавить</button>
    </div>

</form>

</body>
</html>
